use_default_settings: true

general:
  instance_name: "OpenClaw SearXNG"
  debug: false

search:
  safe_search: 0
  autocomplete: ""
  default_lang: "en"
  formats:
    - html
    - json

server:
  secret_key: "openclaw-searxng-local-only"
  limiter: false
  image_proxy: false
  port: 8080
  bind_address: "0.0.0.0"

ui:
  static_use_hash: true

# Engine selection: only engines that reliably respond from this IP.
engines:
  # --- Reliable general engines ---
  - name: bing
    engine: bing
    shortcut: bi
    disabled: false
  - name: yahoo
    engine: yahoo
    shortcut: yh
    disabled: false

  # --- Knowledge / reference ---
  - name: wikipedia
    engine: wikipedia
    shortcut: wp
    disabled: false
  - name: wikidata
    engine: wikidata
    shortcut: wd
    disabled: false
  - name: currency
    engine: currency_convert
    shortcut: cc
    disabled: false

  # --- Dev / technical ---
  - name: github
    engine: github
    shortcut: gh
    disabled: false
  - name: stackoverflow
    engine: stackoverflow
    shortcut: so
    disabled: false
  - name: arxiv
    engine: arxiv
    shortcut: ar
    disabled: false
  - name: npm
    engine: npm
    shortcut: npm
    disabled: false
  - name: pypi
    engine: pypi
    shortcut: pypi
    disabled: false
  - name: mdn
    engine: mdn
    shortcut: mdn
    disabled: false

  # --- Disabled: CAPTCHA / rate-limited / geo-blocked ---
  - name: google
    engine: google
    shortcut: go
    disabled: true
  - name: duckduckgo
    engine: duckduckgo
    shortcut: ddg
    disabled: true
  - name: startpage
    engine: startpage
    shortcut: sp
    disabled: true
  - name: brave
    engine: brave
    shortcut: br
    disabled: true
  - name: qwant
    engine: qwant
    shortcut: qw
    disabled: true
  - name: mojeek
    engine: mojeek
    shortcut: mj
    disabled: true
